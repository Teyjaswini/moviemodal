<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="backDrop closeModal" id="backDrop"></div>

    <div class="movieModal" id="movieModal">
        <form id="movieForm">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between">
                    <h4>Add Movie</h4>
                    <i role="button" class="closeModal fa-solid fa-xmark fa-2x"></i>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="movieName">Movie Name</label>
                        <input type="text" class="form-control" id="movieName">
                    </div>

                    <div class="form-group">
                        <label for="movieImg">Movie Image</label>
                        <input type="text" class="form-control" id="movieImg">
                    </div>

                    <div class="form-group">
                        <label for="movieDescription">Movie Description</label>
                        <textarea rows="5" id="movieDescription" class="form-control"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="movieRating">Movie Rating</label>
                        <select id="movieRating" class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                </div>


                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" id="addMovieBtn" class="btn btn-sm net-sec-btn">
                        Add Movie
                    </button>

                    <button type="button" id="updateMovieBtn" class="btn btn-sm net-sec-btn d-none">
                        Update Movie
                    </button>

                    <button type="button" class="btn btn-sm net-pri-btn closeModal">
                        Close
                    </button>
                </div>
            </div>
        </form>
    </div>










    <div class="container pt-5 mb-5">
        <div class="row">
            <div class="col-6">
                <a href="index.html" class="logo">
                    <img src="./assets/img/logo.svg" alt="Logo" title="Logo">
                </a>
            </div>
            <div class="col-6 align-self-center text-right">
                <button id="movieModalShowBtn" class="btn btn-sm net-pri-btn">Add Movie</button>
            </div>
        </div>
    </div>
    <div class="container-fluid">
        <div class="row" id="movieContainer">
            <div class="col-md-3 col-sm-6">
                <div class="card movieCard">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-10">
                                <h4>Movie Name</h4>
                            </div>
                            <div class="col-2">
                                <h4>
                                    <span class="badge badge-success">5</span>

                                </h4>
                            </div>
                        </div>
                    </div>
